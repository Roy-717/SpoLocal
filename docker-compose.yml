services:
  spolocal:
    build: .
    container_name: spolocal
    expose:
      - "8000"
    environment:
      SPLOCAL_PLAYLISTS_PATH: /data/webapp_playlists.json
    volumes:
      - ./downloads:/app/downloads
      - ./data:/data
      # Mount only live-edited assets; leave static/pwa/ from the image (npm run build:pwa).
      - ./webapp/static/js:/app/webapp/static/js
      - ./webapp/static/css:/app/webapp/static/css
      - ./webapp/templates:/app/webapp/templates
      - ./webapp/main.py:/app/webapp/main.py
      - ./webapp/lyrics_fetch.py:/app/webapp/lyrics_fetch.py
      - ./webapp/lyrics_files.py:/app/webapp/lyrics_files.py
      - ./webapp/download_service.py:/app/webapp/download_service.py
      - ./webapp/tag_metadata.py:/app/webapp/tag_metadata.py
      - ./webapp/models.py:/app/webapp/models.py
      - ./webapp/audio_quality.py:/app/webapp/audio_quality.py
      - ./webapp/media_server.py:/app/webapp/media_server.py
      - ./webapp/loudness_analysis.py:/app/webapp/loudness_analysis.py
      - ./spotify_scraper.py:/app/spotify_scraper.py
    # Optional: copy webapp/.env.example → webapp/.env, then add:
    #   - ./webapp/.env:/app/webapp/.env:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: spolocal-caddy
    ports:
      - "8000:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - spolocal
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
